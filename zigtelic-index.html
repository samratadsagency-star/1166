<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zigtelic Review Auto-Reply</title><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#fff}header{padding:22px 5%;background:#111936;display:flex;justify-content:space-between;align-items:center}main{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:#151d38;border:1px solid #2a355c;border-radius:16px;padding:20px;margin:16px 0}.btn{background:#fff;color:#111;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.btn.alt{background:#2b385f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}textarea,input{width:100%;box-sizing:border-box;background:#0e1530;color:#fff;border:1px solid #34416d;border-radius:10px;padding:12px;margin:8px 0}small{color:#aeb8d6}.review{padding:16px;border:1px solid #303c66;border-radius:12px;margin:12px 0}.stars{color:#ffd34d}.ok{color:#67e8a5}</style></head><body><header><div><b>ZIGTELIC</b><div><small>Google Review Auto-Reply</small></div></div><a class="btn" href="/auth/google">Connect Google</a></header><main><div class="card"><h2>AI Review Reply</h2><p>Google Business Profile connect करें, reviews देखें, AI reply बनाएं और publish करें.</p><p id="status"><small>Google account connected होने पर reviews यहाँ दिखेंगे.</small></p></div><div class="grid"><div class="card"><h3>Business</h3><input id="sid" placeholder="Session ID (OAuth के बाद URL से auto)"/><input id="account" placeholder="Account ID"/><input id="location" placeholder="Location ID"/><button class="btn" onclick="loadReviews()">Load Reviews</button></div><div class="card"><h3>Manual AI Test</h3><textarea id="test" rows="5" placeholder="Review यहाँ डालें..."></textarea><button class="btn alt" onclick="generateTest()">Generate Reply</button><textarea id="out" rows="4" placeholder="Reply..."></textarea></div></div><div id="reviews" class="card"><h3>Reviews</h3><small>No reviews loaded.</small></div></main><script>const p=new URLSearchParams(location.search);if(p.get('sid')){document.getElementById('sid').value=p.get('sid');document.getElementById('status').innerHTML='<span class="ok">✓ Google connected</span>';}
async function generateTest(){let review=document.getElementById('test').value;let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review,business:'Zigtelic'})});let d=await r.json();document.getElementById('out').value=d.reply}
async function loadReviews(){let sid=document.getElementById('sid').value,accountId=document.getElementById('account').value,locationId=document.getElementById('location').value;let r=await fetch(`/api/reviews?sid=${encodeURIComponent(sid)}&accountId=${encodeURIComponent(accountId)}&locationId=${encodeURIComponent(locationId)}`);let d=await r.json();let box=document.getElementById('reviews');if(d.error){box.innerHTML='<h3>Reviews</h3><p>'+d.error+'</p>';return}let arr=d.reviews||[];box.innerHTML='<h3>Reviews</h3>'+arr.map(x=>{let id=(x.name||'').split('/').pop();let text=(x.comment||'');return `<div class="review"><div class="stars">${'★'.repeat(Number(x.starRating||0))}</div><p>${esc(text)}</p><textarea id="r_${id}" rows="3">${esc(x.reviewReply?.comment||'')}</textarea><button class="btn alt" onclick="reply('${id}')">Publish Reply</button></div>`}).join('')}
async function reply(reviewId){let sid=document.getElementById('sid').value,accountId=document.getElementById('account').value,locationId=document.getElementById('location').value,comment=document.getElementById('r_'+reviewId).value;if(!comment.trim())return alert('Reply खाली है');if(!confirm('Google पर यह reply publish करें?'))return;let r=await fetch('/api/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid,accountId,locationId,reviewId,comment})});let d=await r.json();alert(d.error||'Reply published');}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
